trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: CI
    displayName: 'Build, Check e Containerização'
    jobs:
      - job: BuildAndValidate
        displayName: 'Validar Backend, Frontend e Docker Compose'
        steps:
          - task: UsePythonVersion@0
            displayName: 'Configurar Python 3.12'
            inputs:
              versionSpec: '3.12'

          - script: |
              cd backend
              python -m venv .venv
              source .venv/bin/activate
              pip install --upgrade pip
              pip install -r requirements.txt
              python -m compileall app
              pytest -v
            displayName: 'Check e Testes do Backend (FastAPI)'

          - task: NodeTool@0
            displayName: 'Configurar Node.js 20.x'
            inputs:
              versionSpec: '20.x'

          - script: |
              cd frontend
              npm install
              npm run build
            displayName: 'Build do Frontend (React + TypeScript + Vite)'

          - script: |
              docker compose build
            displayName: 'Docker Compose Build'

