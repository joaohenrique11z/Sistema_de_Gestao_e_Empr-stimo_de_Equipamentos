services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equipamentos-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Sistema de Gestão e Empréstimo de Equipamentos
      - APP_ENV=development
    volumes:
      - ./backend:/app
      - /app/.venv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: equipamentos-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

